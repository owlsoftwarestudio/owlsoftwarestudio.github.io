<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }} · Owl Software Studio</title>
  <meta name="description" content="{{ site.description | escape }}">
  <link rel="icon" href="{{ '/assets/logo.png' | relative_url }}" type="image/png">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Owl Software Studio home">
      <img src="{{ '/assets/logo.png' | relative_url }}" alt="Owl Software Studios" width="280" height="200">
    </a>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}">Our apps</a>
      <a href="mailto:support@owlsoftware.studio">Contact support <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main tabindex="-1" id="main" class="{% if page.home %}home{% else %}document{% endif %}">
    {% unless page.home %}<a class="back-link" href="{{ '/' | relative_url }}">← All apps</a>{% endunless %}
    {{ content }}
  </main>
  <footer><span>Owl Software Studio</span><span>Thoughtful apps. Everyday possibilities.</span><a href="mailto:support@owlsoftware.studio">Get in touch ↗</a></footer>
  <div id="route-status" class="sr-only" role="status" aria-live="polite"></div>
  <div id="page-store" hidden>
    {% for document in site.pages %}
      {% if document.path contains '.md' %}
      <template data-url="{{ document.url | relative_url }}" data-title="{{ document.title | default: site.title | escape }}" data-home="{{ document.home | default: false }}">
        {{ document.content | markdownify }}
      </template>
      {% endif %}
    {% endfor %}
  </div>
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</body>
</html>
